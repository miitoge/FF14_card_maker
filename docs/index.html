<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF14 自己紹介カードメーカー</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0c0e13;--pn:#151922;--ln:#272c38;--tx:#eceef3;--mu:#8b92a3;--ac:#7fb0ff;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 'Noto Sans JP',system-ui,sans-serif}
header{max-width:1320px;margin:0 auto;padding:20px 20px 0}
h1{margin:0;font-size:19px}header p{margin:0;color:var(--mu);font-size:13px}
.wrap{max-width:1320px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
.col{position:sticky;top:12px}
.pv{position:relative;width:100%;overflow:hidden;border-radius:14px;touch-action:none;user-select:none;background:#07080b}
.seg{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);padding:11px 16px;text-decoration:none;text-align:center}
.seg button{padding:6px 12px;font-size:13px;border-radius:99px;color:var(--mu);background:#10131a}
[aria-pressed=true]{background:var(--ac)!important;border-color:var(--ac)!important;color:#06121f!important;font-weight:700}
.bar{display:flex;gap:10px;margin-top:12px;align-items:center}
.bar .sw{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.bar .sw button{border:0;border-radius:0;padding:11px 20px}
.pri{flex:1;background:var(--ac);border-color:var(--ac);color:#06121f;font-weight:700}
.hint{font-size:12px;color:var(--mu);margin:8px 2px 0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tabs button{padding:10px 4px;font-size:14px}
.tabs button[aria-pressed=true]{background:#fff!important;border-color:#fff!important}
section{display:none;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:6px 16px 18px}
section.on{display:block}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 5px}
input[type=text],select,textarea{width:100%;background:#0f1218;border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:10px 11px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
textarea{resize:vertical;min-height:90px}input[type=range]{width:100%;accent-color:var(--ac)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.jl label{margin:0;display:flex;align-items:center;gap:4px;background:#0f1218;border:1px solid var(--ln);border-radius:6px;padding:0 6px;font:600 12px 'Barlow Condensed';color:var(--mu)}
.jl input{width:100%;min-width:0;background:none;border:0;color:var(--tx);padding:7px 0;font:700 16px 'Barlow Condensed';text-align:right}
.g4{display:grid;gap:5px}.g4 button{padding:8px 0;font-size:13px;border-radius:6px;background:#0f1218;color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(6,7,10,.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;z-index:9;overflow:auto}
#modal.on{display:flex}#modal img{max-width:min(100%,900px);max-height:42vh;border-radius:6px}#modal p{margin:0;color:#ccc;font-size:14px;text-align:center}
@media(max-width:900px){.wrap{grid-template-columns:1fr;padding-bottom:84px}.col{top:0;z-index:5;background:var(--bg);margin:0 -20px;padding:8px 12px 4px}
.bar.main{position:fixed;left:0;right:0;bottom:0;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln);z-index:6}.hint{display:none}}

/* ===== CARD ===== */
.scaler{position:absolute;left:0;top:0;width:1200px;height:675px;transform-origin:0 0;perspective:1800px}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:'Noto Sans JP',sans-serif;color:#f3f4f7;background:#0d1016}
#back{transform:rotateY(180deg);background:radial-gradient(900px 500px at 100% 0,#1c2436,transparent 60%),#0d1016}
.gl{position:absolute;inset:0;pointer-events:none;opacity:var(--go,0);transition:opacity .3s;background:radial-gradient(520px circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.17),transparent 62%)}
#shot{position:absolute;max-width:none;display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;line-height:1.8;color:#7d8495;background:repeating-linear-gradient(45deg,#14171d 0 22px,#171a21 22px 44px)}
#dim{position:absolute;inset:0;background:#000;opacity:.25}
.vg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,13,.9),rgba(7,9,13,.55) 40%,transparent 72%),linear-gradient(0deg,rgba(7,9,13,.85),transparent 52%)}
.bd{position:absolute;inset:20px;border:1px solid rgba(255,255,255,.2);pointer-events:none}
.fcx{position:absolute;left:64px;top:50px;font-size:22px;letter-spacing:.1em;border-left:4px solid var(--rc);padding-left:12px}
.xid{position:absolute;right:56px;top:48px;font:600 28px 'Barlow Condensed';letter-spacing:.06em}
.info{position:absolute;left:64px;right:340px;bottom:58px}
.rowt{display:flex;align-items:center;gap:16px;font-size:23px;color:#d3d7e0}
.pill{padding:2px 18px;border-radius:99px;background:var(--rc);color:#0b0d12;font-weight:900;font-size:21px}
.tt{font-size:27px;color:#d3d7e0;margin-top:14px;min-height:36px}
.nm{font-weight:900;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.jobrow{display:flex;align-items:center;gap:20px;margin-top:22px}
.hx{position:relative;width:76px;height:85px;flex:none}.hx svg{position:absolute;inset:0;width:100%;height:100%}
.hx b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 25px 'Barlow Condensed';color:#0b0d12}
.jn{font-size:36px;font-weight:700;line-height:1.2}
.lvx{font:600 23px 'Barlow Condensed';letter-spacing:.14em;color:#d3d7e0}.lvx b{font-size:42px;color:#fff;margin-left:8px;letter-spacing:0}
.cr{position:absolute;right:48px;bottom:30px;font:500 13px 'Barlow Condensed';letter-spacing:.2em;color:#b5bac6}
.bk{position:absolute;inset:0;display:flex;gap:40px;padding:38px 52px 30px}
.bl{width:610px;display:flex;flex-direction:column;min-height:0}.br{flex:1;display:flex;flex-direction:column;min-width:0}
h4{margin:14px 0 8px;font-size:15px;letter-spacing:.14em;color:var(--rc);font-weight:700}
.tt2{font-size:20px;color:#aab0bf;min-height:26px}.nm2{font-size:54px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:28px;margin-top:8px}.meta small{display:block;font-size:12px;color:#8b92a3;letter-spacing:.12em}.meta div{font-size:20px;font-weight:700}
.jg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.jc{height:52px;border:1px solid #2b3140;border-top:3px solid var(--c);background:#121620;text-align:center;font:600 14px 'Barlow Condensed';color:#9aa1b3;line-height:1.15;padding-top:3px}.jc b{display:block;font-size:23px;color:#fff}
.jc.m{background:var(--c);color:#0b0d12}.jc.m b{color:#0b0d12}
.none{color:#6f7686;font-size:15px}
.intro{margin-top:auto}.intro div{font-size:18px;line-height:1.6;white-space:pre-wrap;color:#e6e8ee;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding:9px 14px;background:#121620;border-left:4px solid var(--rc)}
.mx{display:grid;grid-template-columns:56px repeat(3,1fr);gap:6px;align-items:center;font-size:16px;font-weight:700}
.mx i{font-style:normal;text-align:center;font-size:13px;color:var(--c);font-weight:700}
.c{height:33px;border:1px solid #2b3140;background:#121620;text-align:center;line-height:31px;color:#0b0d12}.c.on{background:var(--c);border-color:var(--c)}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.sg div{height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #2b3140;font-size:15px;color:#6f7686;background:#121620}
.sg .on{background:var(--rc);border-color:var(--rc);color:#0b0d12;font-weight:700}
.hr{display:grid;grid-template-columns:50px repeat(4,1fr);gap:5px;align-items:center;font-size:15px;font-weight:700}.hr i{font-style:normal;font-size:13px;text-align:center;color:#8b92a3;font-weight:400}
.hr .c{height:28px}
.fo{margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid #272c38;padding-top:10px;font-size:17px;font-weight:700}
.fo span{font-weight:400;color:#8b92a3;font-size:15px}
.cp{font:500 11px 'Barlow Condensed';letter-spacing:.18em;color:#6f7686;margin-top:6px}

@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.7)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(70px) rotate(8deg)}to{opacity:1;transform:none}}
@keyframes sw{0%,50%{left:-340px}100%{left:1500px}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes au{from{transform:translate(0,0)}to{transform:translate(60px,40px)}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes prism{0%,100%{border-color:#ff7ad9;box-shadow:0 0 24px #ff7ad9aa,inset 0 0 24px #ff7ad955}33%{border-color:#ffe27a;box-shadow:0 0 24px #ffe27aaa,inset 0 0 24px #ffe27a55}66%{border-color:#7affd1;box-shadow:0 0 24px #7affd1aa,inset 0 0 24px #7affd155}}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;background:radial-gradient(600px 420px at 20% 10%,rgba(127,176,255,.14),transparent),radial-gradient(520px 420px at 85% 80%,rgba(255,110,200,.1),transparent);animation:au 16s ease-in-out infinite alternate}
button:active{transform:scale(.97)}section.on{animation:fi .35s}
#shot{animation:kb 16s ease-in-out infinite alternate}.hx{animation:br 3.2s ease-in-out infinite}
.pill::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#0b0d12;margin-right:9px;animation:dot 1.6s infinite}
.nm span{display:inline-block;white-space:pre}
.play .info>*,.play .fcx,.play .xid{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*110ms + 150ms)}
.play .nm span{animation:drop .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*45ms + 350ms)}
.play .jc,.play .sg div,.play .c{animation:pop .5s cubic-bezier(.2,1.2,.3,1) both;animation-delay:calc(var(--i,0)*24ms)}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;transition:opacity .3s;opacity:calc(var(--ho,.5)*var(--hon,0));background:linear-gradient(115deg,transparent 18%,rgba(255,0,140,.3) 34%,rgba(255,230,0,.3) 44%,rgba(0,255,200,.3) 54%,rgba(80,120,255,.3) 66%,transparent 82%);background-size:280% 280%;background-position:var(--gx,50%) var(--gy,50%)}
.sweep{position:absolute;top:-20px;bottom:-20px;width:240px;left:-340px;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);transform:skewX(-18deg);animation:sw 6s ease-in-out infinite}
[data-r="1"]{--hon:0}[data-r="2"]{--hon:.7}[data-r="3"]{--hon:1}
[data-r="1"] .bd{border-color:rgba(255,214,120,.8);box-shadow:0 0 18px rgba(255,200,90,.35),inset 0 0 18px rgba(255,200,90,.18)}
[data-r="2"] .bd{border-color:rgba(160,220,255,.85);box-shadow:0 0 22px rgba(120,200,255,.4),inset 0 0 22px rgba(120,200,255,.2)}
[data-r="3"] .bd{border-color:#ffe27a;animation:prism 4s linear infinite}
.nofx *,.nofx *::before{animation:none!important}
</style></head>
<body>
<header><h1>FF14 自己紹介カードメーカー</h1><p>表はSS、裏は詳細シート。カードにカーソルを重ねると傾き、クリックで裏返ります。データは端末の外へ送信されません。</p></header>
<div class="wrap">
<div class="col">
  <div class="pv" id="pv"><div class="scaler" id="scaler"><div class="tilt" id="tilt">
    <div class="face" id="front">
      <img id="shot" alt=""><div id="empty">スクリーンショットを<br>ここにドロップ／タップして選択</div>
      <div id="dim"></div><div class="vg"></div><div class="bd"></div>
      <div class="fcx" id="f_fc"></div><div class="xid" id="f_x"></div>
      <div class="info">
        <div class="rowt" style="--d:0"><span class="pill" id="f_pill"></span><span id="f_sv"></span></div>
        <div class="tt" id="f_title" style="--d:1"></div><div class="nm" id="f_name" style="--d:2"></div>
        <div class="jobrow" style="--d:3"><div class="hx"><svg viewBox="0 0 92 103"><polygon id="f_hx" points="46,2 88,26 88,77 46,101 4,77 4,26"/></svg><b id="f_ab"></b></div><div><div class="jn" id="f_jn"></div><div class="lvx" id="f_lv"></div></div></div>
      </div>
      <div class="cr">SCREENSHOT © SQUARE ENIX</div><div class="holo"></div><div class="sweep"></div><div class="gl"></div>
    </div>
    <div class="face" id="back"></div>
  </div><canvas id="fx" width="1200" height="675" style="position:absolute;left:0;top:0;pointer-events:none"></canvas></div></div>
  <div class="bar"><div class="sw" id="sw"><button data-s="front">表</button><button data-s="back">裏</button></div><button id="fxb" onclick="S.fx=!S.fx;render()">演出</button><button onclick="gyro()">傾きセンサー</button></div>
  <div class="bar main"><button class="pri" onclick="save()">画像を保存（表＋裏）</button><a class="btn" target="_blank" rel="noopener" href="https://x.com/intent/post?text=%23FF14">Xで投稿</a></div>
</div>

<div>
  <div class="tabs" id="tabs"></div>
  <section class="on">
    <label>ロドストのキャラクターURL または ID（名前・ワールド・種族・ジョブレベルなどを自動入力）</label>
    <div style="display:flex;gap:8px"><input type="text" id="ldu" placeholder="https://jp.finalfantasyxiv.com/lodestone/character/12345678/"><button class="pri" style="flex:none" onclick="impID()">取り込む</button></div>
    <p class="hint" id="ldst">入力したあとも、すべての項目を自由に編集できます。</p>
    <label>スクリーンショット（ドラッグで位置、ホイール／ピンチでズーム。画像の外側には動かせません）</label>
    <input type="file" id="file" accept="image/*" style="width:100%;color:var(--mu)">
    <div class="r2"><div><label>ズーム</label><input type="range" id="z" min="100" max="400" value="100"></div><div><label>暗さ</label><input type="range" id="dm" min="0" max="70" value="25"></div></div>
    <button style="margin-top:10px;width:100%" onclick="ox=oy=0;S.z=100;layout()">位置・ズームをリセット</button>
    <label>キャラクター名</label><input type="text" id="name" maxlength="30">
    <label>称号</label><input type="text" id="title" maxlength="30">
    <div class="r2"><div><label>DC</label><select id="dc"></select></div><div><label>ワールド</label><input type="text" id="world" maxlength="16"></div></div>
    <div class="r2"><div><label>種族</label><select id="race"></select></div><div><label>求めているもの</label><select id="want"></select></div></div>
    <div class="r2"><div><label>メインジョブ</label><select id="job"></select></div><div><label>FC（左上に表示）</label><input type="text" id="fc" maxlength="20"></div></div>
    <label>X ID</label><input type="text" id="tw" maxlength="20" placeholder="@your_id">
    <label>カードのレア度（ジョブ合計レベルで自動決定／演出が変わります）</label><div class="seg" id="rar"></div>
    <label>差し色</label><div class="seg" id="acs"></div>
  </section>
  <section>
    <label>予備の方法：ロドストの「クラス・ジョブ」ページを開き、全選択→コピー→貼り付け</label>
    <textarea id="paste" placeholder="ここに貼り付け"></textarea>
    <div class="r2" style="margin-top:8px"><button onclick="impPaste()">読み取る</button><a class="btn" target="_blank" rel="noopener" href="https://jp.finalfantasyxiv.com/lodestone/">ロドストを開く</a></div>
    <p class="hint" id="imps">端末内で解析します。読み取れない場合は下に手入力してください。</p>
    <label>ジョブレベル（入力したジョブだけ裏面に表示）</label><div class="jl" id="jl"></div>
    <label>ジョブアイコン画像（任意）：公式アイコンなど、ご自身で用意した画像を登録</label><input type="file" id="icf" multiple accept="image/*" style="width:100%;color:var(--mu)">
    <p class="hint">ファイル名をジョブ略称にしてください（例 SCH.png）。1枚だけ選ぶと現在のメインジョブに登録します。</p><button style="width:100%" onclick="IC={};try{localStorage.removeItem('ffico')}catch(e){}render()">登録したアイコンを消去</button>
  </section>
  <section>
    <label>コンテンツ経験（ロール別・あるものを選択）</label><div class="g4" id="ctg" style="grid-template-columns:44px repeat(3,1fr)"></div>
    <label>MSQ（クリア済みの最新）</label><select id="msq"></select>
    <label>遊ぶ時間帯</label><div class="g4" id="hrg" style="grid-template-columns:44px repeat(4,1fr)"></div>
    <label>VC</label><select id="vc"></select>
  </section>
  <section>
    <label>自己紹介（裏面に表示）</label><textarea id="msg" maxlength="120" style="min-height:140px"></textarea>
    <button style="margin-top:14px;width:100%" onclick="resetAll()">すべてリセット</button>
  </section>
</div></div>
<div id="modal" onclick="this.classList.remove('on')"><img id="o1" alt="表"><img id="o2" alt="裏"><p>長押し（PCは右クリック）で保存。タップで閉じる</p></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RC={tank:'#4f86e0',healer:'#58c07c',dps:'#e0605f',craft:'#c9a24a'},RL={tank:'タンク',healer:'ヒーラー',dps:'DPS',craft:'クラフター・ギャザラー'};
const JD={tank:'ナイト PLD,戦士 WAR,暗黒騎士 DRK,ガンブレイカー GNB',healer:'白魔道士 WHM,学者 SCH,占星術師 AST,賢者 SGE',dps:'モンク MNK,竜騎士 DRG,忍者 NIN,侍 SAM,リーパー RPR,ヴァイパー VPR,吟遊詩人 BRD,機工士 MCH,踊り子 DNC,黒魔道士 BLM,召喚士 SMN,赤魔道士 RDM,ピクトマンサー PCT,青魔道士 BLU,魔獣使い 魔獣',craft:'木工師 CRP,鍛冶師 BSM,甲冑師 ARM,彫金師 GSM,革細工師 LTW,裁縫師 WVR,錬金術師 ALC,調理師 CUL,採掘師 MIN,園芸師 BTN,漁師 FSH'};
const J=Object.entries(JD).flatMap(([r,s])=>s.split(',').map(x=>{const[n,a]=x.split(' ');return{n,a,r}})),JM=Object.fromEntries(J.map(j=>[j.n,j]));
